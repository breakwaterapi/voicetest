[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai>=0.0.60",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "twilio>=9.0",
    # Pinned to the SDK generation the provider code targets:
    #   cartesia v1.x  → client.tts.sse(voice_id=…), event.data
    #   deepgram v3.x  → from deepgram import LiveOptions; client.listen.asynclive.v("1")
    "cartesia>=1.0,<2",
    "deepgram-sdk>=3.0,<4",
    "anthropic>=0.40",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["voicetest*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
